- type: Features
  data:
  - name: Agent Studio
    description: Dashboard for building, configuring, optimizing, and managing customer-facing AI agents.
  - name: Ghostwriter
    description: Agent-building agent that generates production-ready agents from SOPs, transcripts, or
      plain English descriptions.
  - name: Insights
    description: Analytics suite covering conversation Explorer, proactive Monitors, multivariate Experiments,
      and tool-call Observability.
  - name: Agent Data Platform
    description: Integrates customer context, conversation history, and data warehouses for personalization.
  - name: Voice Agents
    description: AI agents deployable across voice, chat, SMS, WhatsApp, email, and ChatGPT channels.
  - name: Live Assist
    description: Seamless escalation and human-in-the-loop handoff from AI agents to live customer service
      reps.
