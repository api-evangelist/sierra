aid: sierra
name: Sierra
description: Sierra is an enterprise conversational AI platform co-founded by Bret Taylor that builds and
  operates customer-facing AI agents across chat, SMS, WhatsApp, email, voice, and ChatGPT. Its Agent OS
  includes Agent Studio for building agents, Ghostwriter for agent generation from SOPs and transcripts,
  Insights for analytics, an Agent Data Platform for personalization, Voice Agents, and Live Assist for human
  handoff. Sierra is enterprise sales-led with no self-serve public developer API; integrations and Agent
  SDK access are provisioned through customer engagements.
